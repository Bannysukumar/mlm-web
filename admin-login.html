<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLM Platform - Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .admin-login-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            padding: 2rem;
        }
        .admin-login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .admin-login-header i {
            font-size: 3rem;
            color: #1e3c72;
            margin-bottom: 1rem;
        }
        .admin-login-header h2 {
            color: #1e3c72;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        .admin-login-header p {
            color: #6c757d;
            font-size: 0.9rem;
        }
        .form-control {
            border-radius: 8px;
            padding: 0.8rem 1rem;
            border: 1px solid #dee2e6;
        }
        .form-control:focus {
            border-color: #1e3c72;
            box-shadow: 0 0 0 0.2rem rgba(30, 60, 114, 0.25);
        }
        .btn-admin-login {
            background: #1e3c72;
            border: none;
            border-radius: 8px;
            padding: 0.8rem;
            font-weight: 500;
            width: 100%;
            margin-top: 1rem;
            transition: all 0.3s ease;
        }
        .btn-admin-login:hover {
            background: #2a5298;
            transform: translateY(-2px);
        }
        .input-group-text {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px 0 0 8px;
        }
        .form-check-input:checked {
            background-color: #1e3c72;
            border-color: #1e3c72;
        }
        .back-to-site {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
        }
        .back-to-site:hover {
            color: white;
            transform: translateX(-5px);
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-to-site">
        <i class="fas fa-arrow-left"></i>
        Back to Site
    </a>

    <div class="container">
        <div class="admin-login-card">
            <div class="admin-login-header">
                <i class="fas fa-shield-alt"></i>
                <h2>Admin Login</h2>
                <p>Secure access to platform management</p>
            </div>
            <form id="adminLoginForm" onsubmit="handleAdminLogin(event)">
                <div class="mb-3">
                    <label class="form-label">Admin Username</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fas fa-user-shield"></i>
                        </span>
                        <input type="text" class="form-control" id="adminUsername" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fas fa-lock"></i>
                        </span>
                        <input type="password" class="form-control" id="adminPassword" required>
                    </div>
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="rememberAdmin">
                    <label class="form-check-label" for="rememberAdmin">Remember me</label>
                </div>
                <button type="submit" class="btn btn-primary btn-admin-login">
                    <i class="fas fa-sign-in-alt me-2"></i>Login to Admin Panel
                </button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.5.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.5.0/firebase-auth.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.5.0/firebase-analytics.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCAqUgn1BtDbvHTk4ZEFmEyPIn8-Q5wz_M",
            authDomain: "mlmwe-a0485.firebaseapp.com",
            projectId: "mlmwe-a0485",
            storageBucket: "mlmwe-a0485.firebasestorage.app",
            messagingSenderId: "82709627017",
            appId: "1:82709627017:web:04e57f39cf5c954cad0658",
            measurementId: "G-R9EFL7E30S"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const analytics = getAnalytics(app);

        // Check for existing admin session
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // User is signed in
                window.location.href = 'admin-dashboard.html';
            }
        });

        // Handle admin login
        window.handleAdminLogin = async function(event) {
            event.preventDefault();
            
            const email = document.getElementById('adminUsername').value;
            const password = document.getElementById('adminPassword').value;
            const remember = document.getElementById('rememberAdmin').checked;

            try {
                // Sign in with Firebase
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // Store admin session if remember me is checked
                if (remember) {
                    localStorage.setItem('adminSession', 'true');
                    localStorage.setItem('adminUsername', email);
                } else {
                    sessionStorage.setItem('adminSession', 'true');
                    sessionStorage.setItem('adminUsername', email);
                }

                // Redirect to admin dashboard
                window.location.href = 'admin-dashboard.html';
            } catch (error) {
                // Handle errors
                let errorMessage = 'Invalid admin credentials. Please try again.';
                switch (error.code) {
                    case 'auth/invalid-email':
                        errorMessage = 'Invalid email address.';
                        break;
                    case 'auth/user-disabled':
                        errorMessage = 'This account has been disabled.';
                        break;
                    case 'auth/user-not-found':
                        errorMessage = 'No account found with this email.';
                        break;
                    case 'auth/wrong-password':
                        errorMessage = 'Incorrect password.';
                        break;
                    default:
                        errorMessage = 'An error occurred. Please try again.';
                }
                alert(errorMessage);
            }
        };
    </script>
</body>
</html>
